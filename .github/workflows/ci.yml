name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # Cross-platform projects (net8.0) and tests only.
    # Windows projects (WPF App, Webcam, Pylon) are verified on a local Windows machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test (builds referenced net8.0 projects)
        run: dotnet test tests/CamBridge.Tests --configuration Release
